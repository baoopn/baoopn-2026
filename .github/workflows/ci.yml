name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go — vet, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify generated gRPC code is up to date
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.75.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          buf lint
          buf generate
          git diff --exit-code -- gen/

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Pure Go (CGO_ENABLED=0) build
        run: |
          CGO_ENABLED=0 go build -tags nodynamic ./...
          CGO_ENABLED=0 GOOS=linux go build -tags nodynamic -o /tmp/mediaworker ./cmd/mediaworker
          file /tmp/mediaworker | grep -q "statically linked"

      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal migrations)
          if [ -n "$out" ]; then echo "::error::gofmt needed:"; echo "$out"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./...

  web:
    name: Web — check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm run --if-present test
      - run: pnpm build

  worker:
    name: Inbound email worker — test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: node --test
        run: |
          if [ ! -d workers/inbound-email/test ]; then echo "no worker tests yet"; exit 0; fi
          node --test workers/inbound-email/test

  public-safety:
    name: Public-safety check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: No machine paths, keys or secrets in tracked files
        run: sh scripts/check-public.sh

  compose:
    name: Validate compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: docker compose config
        run: |
          export S3_SECRET_ACCESS_KEY=ci-only-placeholder
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml --profile full config -q
          docker compose -f docker-compose.yml --profile backup config -q
          SERVICE_USER_POSTGRES=u SERVICE_PASSWORD_POSTGRES=p SERVICE_PASSWORD_64_INTERNAL=i \
            SERVICE_PASSWORD_64_SECRETS=s SERVICE_URL_WEB=https://example.com \
            docker compose -f docker-compose.coolify.yml config -q

  docker:
    name: Docker build (${{ matrix.image }}, no push)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/${{ matrix.image }}.Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      backup: ${{ steps.filter.outputs.backup }}
    steps:
      # Plain git, no extra token permissions: release.yml calls this
      # workflow with contents: read only.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "backup=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...HEAD")
          if printf '%s\n' "$files" | grep -E -q '^(deploy/backup/|migrations/|\.github/workflows/ci\.yml$|docker-compose[^/]*\.yml$)'; then
            echo "backup=true" >>"$GITHUB_OUTPUT"
          else
            echo "backup=false" >>"$GITHUB_OUTPUT"
          fi

  # Always runs, so a failed path check fails this required check instead of
  # skipping it. On a pull request that does not touch the backup files,
  # every step after the skip notice is skipped.
  backup:
    name: Backup — shellcheck, build, roundtrip
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Path check failed
        if: needs.changes.result != 'success'
        run: |
          echo "::error::the changes job did not succeed"
          exit 1
      - name: Skip notice
        if: needs.changes.outputs.backup != 'true' && github.event_name == 'pull_request'
        run: echo "::notice::no backup changes, skipping"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.changes.outputs.backup == 'true' || github.event_name != 'pull_request'
      - name: shellcheck
        if: needs.changes.outputs.backup == 'true' || github.event_name != 'pull_request'
        run: shellcheck -x deploy/backup/bin/* deploy/backup/test/*.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: needs.changes.outputs.backup == 'true' || github.event_name != 'pull_request'
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        if: needs.changes.outputs.backup == 'true' || github.event_name != 'pull_request'
        with:
          context: deploy/backup
          file: deploy/backup/Dockerfile
          push: false
          load: true
          tags: baoopn-backup:test
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
      - name: Backup/restore roundtrip (local containers, no cloud)
        if: needs.changes.outputs.backup == 'true' || github.event_name != 'pull_request'
        run: SKIP_BUILD=1 sh deploy/backup/test/roundtrip.sh
      - name: Backup status in the database (local containers, no cloud)
        if: needs.changes.outputs.backup == 'true' || github.event_name != 'pull_request'
        run: SKIP_BUILD=1 sh deploy/backup/test/status.sh
