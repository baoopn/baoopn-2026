name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go — vet, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify generated gRPC code is up to date
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.75.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          buf lint
          buf generate
          git diff --exit-code -- gen/

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Pure Go (CGO_ENABLED=0) build
        run: |
          CGO_ENABLED=0 go build -tags nodynamic ./...
          CGO_ENABLED=0 GOOS=linux go build -tags nodynamic -o /tmp/mediaworker ./cmd/mediaworker
          file /tmp/mediaworker | grep -q "statically linked"

      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal migrations)
          if [ -n "$out" ]; then echo "::error::gofmt needed:"; echo "$out"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./...

  web:
    name: Web — check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm run --if-present test
      - run: pnpm build

  worker:
    name: Inbound email worker — test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node --test
        run: |
          if [ ! -d workers/inbound-email/test ]; then echo "no worker tests yet"; exit 0; fi
          node --test workers/inbound-email/test

  public-safety:
    name: Public-safety check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No machine paths, keys or secrets in tracked files
        run: sh scripts/check-public.sh

  compose:
    name: Validate compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          export S3_SECRET_ACCESS_KEY=ci-only-placeholder
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml --profile full config -q
          docker compose -f docker-compose.yml --profile backup config -q
          SERVICE_USER_POSTGRES=u SERVICE_PASSWORD_POSTGRES=p SERVICE_PASSWORD_64_INTERNAL=i \
            SERVICE_PASSWORD_64_SECRETS=s SERVICE_URL_WEB=https://example.com \
            docker compose -f docker-compose.coolify.yml config -q

  docker:
    name: Docker build (${{ matrix.image }}, no push)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/${{ matrix.image }}.Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  backup:
    name: Backup — shellcheck, build, roundtrip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x deploy/backup/bin/* deploy/backup/test/*.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: deploy/backup
          file: deploy/backup/Dockerfile
          push: false
          load: true
          tags: baoopn-backup:test
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
      - name: Backup/restore roundtrip (local containers, no cloud)
        run: SKIP_BUILD=1 sh deploy/backup/test/roundtrip.sh
      - name: Backup status in the database (local containers, no cloud)
        run: SKIP_BUILD=1 sh deploy/backup/test/status.sh
