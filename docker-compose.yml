# Local development. By default Postgres and RustFS (S3-compatible media
# bucket) start: run the API with `make run-api` and the web app with
# `make web-dev`. RustFS console: http://localhost:9001, signing in with
# S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY from your local .env (pick any local
# values; they only protect this throwaway dev container).
# `docker compose --profile full up --build` also runs the api and web images
# (site on http://localhost:3000), reading the rest of the config from .env.
# `docker compose --profile backup ...` runs the encrypted backup service
# against a local volume (see the backup service below and docs/backup.md).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: baoopn
      POSTGRES_PASSWORD: baoopn
      POSTGRES_DB: baoopn
    ports:
      - "5433:5432"
    volumes:
      - baoopn-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baoopn -d baoopn"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object store standing in for Cloudflare R2 in development.
  rustfs:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: http://localhost:9001
      RUSTFS_REGION: us-east-1
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-baoopn-dev}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env (any local value)}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - baoopn-rustfs:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      retries: 20

  # One-shot: create the dev bucket (private; the API streams /media/*).
  rustfs-init:
    image: amazon/aws-cli:2.38.4
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket baoopn-dev ||
        aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket baoopn-dev
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-baoopn-dev}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env (any local value)}
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"

  api:
    profiles: [full]
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://baoopn:baoopn@postgres:5432/baoopn?sslmode=disable
      PUBLIC_URL: http://localhost:3000
      BRAND_CORS_ORIGINS: ${BRAND_CORS_ORIGINS:-https://listening.baoopn.com}
      MEDIA_DIR: /data/media
      # .env points at localhost:9000; inside the network RustFS is rustfs:9000.
      S3_ENDPOINT: http://rustfs:9000
      # gRPC for the mediaworker service below (internal network only).
      GRPC_ADDR: ":9100"
      # Unused-media cleanup: grace before deletion (0 = off), files per run.
      MEDIA_ORPHAN_GRACE: ${MEDIA_ORPHAN_GRACE:-168h}
      MEDIA_ORPHAN_MAX_PER_PASS: ${MEDIA_ORPHAN_MAX_PER_PASS:-50}
    volumes:
      - baoopn-media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully

  # WebP conversion worker (same image, other binary). Needs INTERNAL_API_TOKEN in .env.
  mediaworker:
    profiles: [full]
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    command: ["/usr/local/bin/mediaworker"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      API_GRPC_ADDR: api:9100
      MEDIAWORKER_HEALTH_ADDR: 127.0.0.1:8081
    # The image's HEALTHCHECK is the api's; check the worker instead.
    healthcheck:
      test: ["CMD", "/usr/local/bin/mediaworker", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

  web:
    profiles: [full]
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      ORIGIN: http://localhost:3000
      API_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # Encrypted backups to a local volume (no cloud needed), see docs/backup.md:
  #   docker compose --profile backup run --rm -T backup keygen > .secrets/dev-backup-age-key.txt
  #   set BACKUP_AGE_RECIPIENT=age1... (printed by keygen) in .env, then
  #   docker compose --profile backup run --rm backup backup
  #   docker compose --profile backup run --rm backup list
  #   docker compose --profile backup run --rm -T backup verify latest -i - < .secrets/dev-backup-age-key.txt
  backup:
    profiles: [backup]
    build:
      context: deploy/backup
      args:
        VERSION: dev
    image: baoopn-backup:dev
    command: ["run"]
    restart: unless-stopped
    stop_grace_period: 2m
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: baoopn
      PGPASSWORD: baoopn # ggignore: local dev database only, same as POSTGRES_PASSWORD above
      PGDATABASE: baoopn
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_S3_PROVIDER: ${BACKUP_S3_PROVIDER:-Cloudflare}
      # The local volume below. The BACKUP_S3_* values above are ignored while
      # this is set; remove this line to test a real bucket.
      BACKUP_REMOTE: /backups
      BACKUP_PREFIX: ${BACKUP_PREFIX:-baoopn}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_ON_START: ${BACKUP_ON_START:-false}
      BACKUP_RETRY_MINUTES: ${BACKUP_RETRY_MINUTES:-30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_KEEP_MIN: ${BACKUP_KEEP_MIN:-7}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-26}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
    volumes:
      - baoopn-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/backupctl", "health"]
      interval: 5m
      timeout: 10s
      start_period: 1m
      start_interval: 5s
      retries: 2

volumes:
  baoopn-pg:
  baoopn-media:
  baoopn-rustfs:
  baoopn-backups:
