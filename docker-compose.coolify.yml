# Coolify deployment ("Docker Compose" build pack, Git source). See docs/deployment.md.
#
# Coolify builds every image from the repository on the target server, so no
# container-registry credentials are needed.
#
# In Coolify: New Resource → Public/Private Repository → Build Pack "Docker
# Compose" → Docker Compose Location "/docker-compose.coolify.yml".
# Set the domain on the "web" service only (e.g. https://example.com); Coolify's
# Traefik routes it to port 3000 and handles TLS. The api has no domain: the
# web server proxies /api/* and /media/* to it on the internal network.
#
# Coolify generates every SERVICE_* value below on first deploy:
#   SERVICE_USER_POSTGRES / SERVICE_PASSWORD_POSTGRES   database credentials
#   SERVICE_PASSWORD_64_INTERNAL   INTERNAL_API_TOKEN shared by web and api
#   SERVICE_PASSWORD_64_SECRETS    SECRETS_KEY (salts visitor hashes; keep stable)
#   SERVICE_URL_WEB / SERVICE_FQDN_WEB_3000   from the web service's domain
#
# Set these by hand in the resource's Environment Variables tab (all optional
# unless noted; features stay off while their variables are empty):
#   CLERK_PUBLISHABLE_KEY, CLERK_SECRET_KEY        admin dashboard (production instance)
#   ADMIN_ALLOWED_EMAILS / ADMIN_ALLOWED_USER_IDS  (public_metadata.role = admin also works)
#   GITHUB_USER, GITHUB_TOKEN                      project sync (token raises the rate limit)
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, MAIL_FROM, NOTIFY_EMAIL   outgoing mail
#   INBOUND_MAIL_DOMAIN, INBOUND_WEBHOOK_SECRET    reply threading via the Email Worker
#                                                  (secret must equal the worker's)
#   SPOTIFY_API_URL                                spotify-tracker listening widgets
#   S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, MEDIA_PUBLIC_URL
#                                                  media in a Cloudflare R2 bucket (else the volume)
#   TURNSTILE_SECRET_KEY / PUBLIC_TURNSTILE_SITE_KEY  contact-form captcha
#   MEDIA_MAX_DIMENSION, MEDIA_WEBP_QUALITY, MEDIA_MAX_PIXELS, MEDIAWORKER_CONCURRENCY,
#   MEDIA_UPLOAD_WAIT, MEDIA_JOB_*, MEDIA_FALLBACK_AFTER, MEDIA_FAILED_RETENTION
#                                                  image conversion (defaults are fine)
#   MEDIA_ORPHAN_GRACE, MEDIA_ORPHAN_MAX_PER_PASS  unused-media cleanup (0 grace = off)
#   BACKUP_AGE_RECIPIENT, BACKUP_S3_ENDPOINT, BACKUP_S3_BUCKET, BACKUP_S3_ACCESS_KEY_ID,
#   BACKUP_S3_SECRET_ACCESS_KEY      encrypted off-site DB backups (docs/backup.md; idles until set)
#   BACKUP_TIME, BACKUP_KEEP_DAYS, BACKUP_KEEP_MIN, BACKUP_* ...   schedule/retention (defaults are fine)
#
# Do not add custom networks or published ports: Coolify manages networking.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=${POSTGRES_DB:-baoopn}
    volumes:
      - baoopn-postgres-data:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
      args:
        # Coolify provides SOURCE_COMMIT ("Include Source Commit in Build");
        # shown as the version in the admin dashboard.
        VERSION: ${SOURCE_COMMIT:-coolify}
    image: baoopn-api:latest
    environment:
      - APP_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=json
      - HTTP_ADDR=:8080
      - PUBLIC_URL=${SERVICE_URL_WEB}
      - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-baoopn}?sslmode=disable
      - MIGRATE_ON_START=${MIGRATE_ON_START:-true}
      - SECRETS_KEY=${SERVICE_PASSWORD_64_SECRETS}
      - INTERNAL_API_TOKEN=${SERVICE_PASSWORD_64_INTERNAL}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-240}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY:-}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      - ADMIN_ALLOWED_EMAILS=${ADMIN_ALLOWED_EMAILS:-}
      - ADMIN_ALLOWED_USER_IDS=${ADMIN_ALLOWED_USER_IDS:-}
      - ADMIN_ROLE=${ADMIN_ROLE:-admin}
      - GITHUB_USER=${GITHUB_USER:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_SYNC_INTERVAL=${GITHUB_SYNC_INTERVAL:-6h}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-2587}
      - SMTP_USER=${SMTP_USER:-}
      # useSend: the API key is the SMTP password. Mail stays disabled until set.
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - NOTIFY_EMAIL=${NOTIFY_EMAIL:-}
      - INBOUND_MAIL_DOMAIN=${INBOUND_MAIL_DOMAIN:-}
      - INBOUND_WEBHOOK_SECRET=${INBOUND_WEBHOOK_SECRET:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - MEDIA_DIR=/data/media
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-10}
      # Cloudflare R2 media bucket; on only when endpoint, bucket and both keys
      # are set. Files still on the volume are copied to it on startup.
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_REGION=${S3_REGION:-auto}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-false}
      # The bucket's public custom domain; /media/<file> then 301-redirects there.
      - MEDIA_PUBLIC_URL=${MEDIA_PUBLIC_URL:-}
      # Image conversion queue, served to the mediaworker over gRPC (internal
      # network only; authenticated with INTERNAL_API_TOKEN).
      - GRPC_ADDR=:9100
      - MEDIA_MAX_PIXELS=${MEDIA_MAX_PIXELS:-50000000}
      - MEDIA_UPLOAD_WAIT=${MEDIA_UPLOAD_WAIT:-10s}
      - MEDIA_JOB_LEASE=${MEDIA_JOB_LEASE:-5m}
      - MEDIA_JOB_MAX_ATTEMPTS=${MEDIA_JOB_MAX_ATTEMPTS:-5}
      - MEDIA_FALLBACK_AFTER=${MEDIA_FALLBACK_AFTER:-2m}
      - MEDIA_FAILED_RETENTION=${MEDIA_FAILED_RETENTION:-24h}
      # Unused-media cleanup: grace before deletion (0 = off), files per run.
      - MEDIA_ORPHAN_GRACE=${MEDIA_ORPHAN_GRACE:-168h}
      - MEDIA_ORPHAN_MAX_PER_PASS=${MEDIA_ORPHAN_MAX_PER_PASS:-50}
      - SPOTIFY_API_URL=${SPOTIFY_API_URL:-}
    volumes:
      - baoopn-media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/api", "healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  # Converts uploaded images to WebP (same image as the api, other binary).
  mediaworker:
    # Built and tagged by the api service; never pulled from a registry.
    image: baoopn-api:latest
    pull_policy: never
    command: ["/usr/local/bin/mediaworker"]
    restart: unless-stopped
    mem_limit: ${MEDIAWORKER_MEM_LIMIT:-1g}
    environment:
      - GOMEMLIMIT=${MEDIAWORKER_GOMEMLIMIT:-768MiB}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=json
      - API_GRPC_ADDR=api:9100
      - INTERNAL_API_TOKEN=${SERVICE_PASSWORD_64_INTERNAL}
      - MEDIAWORKER_CONCURRENCY=${MEDIAWORKER_CONCURRENCY:-2}
      - MEDIAWORKER_JOB_TIMEOUT=${MEDIAWORKER_JOB_TIMEOUT:-4m}
      - MEDIAWORKER_POLL_INTERVAL=${MEDIAWORKER_POLL_INTERVAL:-2s}
      - MEDIAWORKER_HEALTH_ADDR=127.0.0.1:8081
      - MEDIA_MAX_DIMENSION=${MEDIA_MAX_DIMENSION:-2400}
      - MEDIA_WEBP_QUALITY=${MEDIA_WEBP_QUALITY:-82}
      - MEDIA_MAX_PIXELS=${MEDIA_MAX_PIXELS:-50000000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/mediaworker", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    image: baoopn-web:latest
    environment:
      - SERVICE_FQDN_WEB_3000
      - PORT=3000
      - ORIGIN=${SERVICE_URL_WEB}
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
      - ADDRESS_HEADER=x-forwarded-for
      - XFF_DEPTH=${XFF_DEPTH:-1}
      # Honour CF-Connecting-IP/CF-IPCountry only behind an origin firewall that admits Cloudflare IPs only.
      - TRUST_CLOUDFLARE=${TRUST_CLOUDFLARE:-false}
      - BODY_SIZE_LIMIT=${BODY_SIZE_LIMIT:-16M}
      - API_URL=http://api:8080
      - INTERNAL_API_TOKEN=${SERVICE_PASSWORD_64_INTERNAL}
      - PUBLIC_TURNSTILE_SITE_KEY=${PUBLIC_TURNSTILE_SITE_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/robots.txt || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5

  # Encrypted off-site Postgres backups to R2 (docs/backup.md). Idles with a
  # WARN, and stays healthy, until BACKUP_AGE_RECIPIENT and BACKUP_S3_* are set.
  backup:
    build:
      context: deploy/backup
      args:
        VERSION: ${SOURCE_COMMIT:-coolify}
    image: baoopn-backup:latest
    command: ["run"]
    restart: unless-stopped
    stop_grace_period: 2m
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=${SERVICE_USER_POSTGRES}
      - PGPASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - PGDATABASE=${POSTGRES_DB:-baoopn}
      - BACKUP_AGE_RECIPIENT=${BACKUP_AGE_RECIPIENT:-}
      - BACKUP_S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET:-}
      - BACKUP_S3_ACCESS_KEY_ID=${BACKUP_S3_ACCESS_KEY_ID:-}
      - BACKUP_S3_SECRET_ACCESS_KEY=${BACKUP_S3_SECRET_ACCESS_KEY:-}
      - BACKUP_S3_REGION=${BACKUP_S3_REGION:-auto}
      - BACKUP_S3_PROVIDER=${BACKUP_S3_PROVIDER:-Cloudflare}
      - BACKUP_REMOTE=${BACKUP_REMOTE:-}
      - BACKUP_PREFIX=${BACKUP_PREFIX:-baoopn}
      - BACKUP_TIME=${BACKUP_TIME:-03:00}
      - BACKUP_ON_START=${BACKUP_ON_START:-false}
      - BACKUP_RETRY_MINUTES=${BACKUP_RETRY_MINUTES:-30}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-30}
      - BACKUP_KEEP_MIN=${BACKUP_KEEP_MIN:-7}
      - BACKUP_MAX_AGE_HOURS=${BACKUP_MAX_AGE_HOURS:-26}
      - BACKUP_PING_URL=${BACKUP_PING_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/backupctl", "health"]
      interval: 5m
      timeout: 10s
      start_period: 1m
      start_interval: 5s
      retries: 2

volumes:
  baoopn-postgres-data:
  baoopn-media:
